<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Motion Review</title>
<style>
:root {
  color-scheme: light;
  --ink: #37352f;
  --muted: #787774;
  --line: #e9e9e7;
  --soft: #f7f7f5;
  --hover: #efefed;
  --danger: #d44c47;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  padding: 24px 28px 32px;
  background: var(--soft);
  color: var(--ink);
  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.header, .videos, .controls, .nav, .status { width: min(1440px, 100%); margin-left: auto; margin-right: auto; }
.header {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 20px;
  align-items: center;
  margin-bottom: 18px;
  padding: 0 2px 18px;
  border-bottom: 1px solid var(--line);
}
.header h2 { font-size: 20px; font-weight: 650; letter-spacing: -0.02em; }
.progress {
  min-width: 88px;
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #fff;
  color: var(--muted);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  text-align: center;
}
.videos { display: flex; gap: 14px; margin-bottom: 16px; align-items: flex-start; }
.video-box, .combined-box {
  flex: 1;
  min-width: 0;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  box-shadow: 0 1px 2px rgba(15, 15, 15, 0.04);
}
.video-box video, .combined-box video { display: block; width: 100%; object-fit: contain; border-radius: 8px; background: #111; }
.video-box video { aspect-ratio: 4 / 3; }
.combined-box video { aspect-ratio: 8 / 3; }
.split-videos { display: none; }
body.video-player .combined-videos { display: none; }
body.video-player .split-videos { display: flex; }
.controls { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 10px; }
.controls button, .nav button {
  min-height: 44px;
  padding: 10px 16px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  color: var(--ink);
  cursor: pointer;
  font: inherit;
  font-size: 14px;
  font-weight: 560;
  transition: background 120ms ease, border-color 120ms ease, transform 80ms ease;
}
.btn-left, .btn-right { border-color: var(--ink) !important; background: var(--ink) !important; color: #fff !important; }
.btn-bad { color: var(--danger) !important; }
.nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 12px; }
.nav button { min-height: 36px; padding: 7px 14px; color: var(--muted); font-size: 13px; }
.nav button:disabled { cursor: not-allowed; opacity: 0.45; }
.status {
  min-height: 36px;
  padding: 9px 12px;
  border-radius: 8px;
  color: var(--muted);
  background: rgba(255, 255, 255, 0.72);
  font-size: 13px;
  text-align: center;
}
.annotator { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.annotator input, .annotator select {
  width: 168px;
  padding: 7px 9px;
  border: 1px solid var(--line);
  border-radius: 7px;
  outline: none;
  background: #fff;
  color: var(--ink);
  font: inherit;
}
.annotator input:focus { border-color: #b4b4b0; box-shadow: 0 0 0 2px rgba(55, 53, 47, 0.08); }
button:hover { background: var(--hover); border-color: #d8d8d5; }
.btn-left:hover, .btn-right:hover { background: #2f2e2a !important; }
button:active { transform: translateY(1px); }
.kbd { display: inline-block; margin-left: 5px; padding: 1px 5px; border: 1px solid rgba(120, 119, 116, 0.25); border-radius: 4px; color: inherit; background: rgba(120, 119, 116, 0.08); font-size: 11px; font-weight: 500; }
@media (max-width: 820px) {
  body { padding: 16px; }
  .header { grid-template-columns: 1fr auto; }
  .annotator { grid-column: 1 / -1; grid-row: 2; }
  .controls { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style></head><body>
<div class="header">
  <h2>Motion review</h2>
  <div class="annotator">
    <label>Annotator:</label>
    <input id="annotator" list="annotator-options" onchange="switchAnnotator()" autocomplete="off">
    <datalist id="annotator-options">ANNOTATOR_OPTIONS</datalist>
  </div>
  <div class="progress" id="progress" data-testid="progress">- / -</div>
</div>
<div class="videos combined-videos">
  <div class="combined-box"><video id="vc" data-testid="combined-video" muted loop playsinline preload="auto"></video></div>
</div>
<div class="videos split-videos">
  <div class="video-box"><video id="vl" muted loop playsinline preload="auto"></video></div>
  <div class="video-box"><video id="vr" muted loop playsinline preload="auto"></video></div>
</div>
<div class="controls">
  <button class="btn-left" data-testid="label-left" onclick="label('left')">Left is better <span class="kbd">1</span></button>
  <button class="btn-right" data-testid="label-right" onclick="label('right')">Right is better <span class="kbd">2</span></button>
  <button class="btn-similar" onclick="label('similar')">Similar <span class="kbd">3</span></button>
  <button class="btn-bad" onclick="label('bad_traj')">Cannot compare <span class="kbd">4</span></button>
</div>
<div class="nav">
  <button onclick="nav(1)">Reload Task <span class="kbd">D</span></button>
  <button id="undo-button" data-testid="undo" onclick="undoLast()" disabled>Undo <span class="kbd">U</span></button>
</div>
<div class="status" id="status" data-testid="status">Preparing the first pair…</div>
<script>
const vl = document.getElementById('vl');
const vr = document.getElementById('vr');
const vc = document.getElementById('vc');
const undoButton = document.getElementById('undo-button');
const serverDefaultAnnotator = DEFAULT_ANNOTATOR;
const pageParams = new URLSearchParams(window.location.search);
const playerMode = pageParams.get('player') || 'combined';
const videoMode = pageParams.get('video') || 'compat';
if (playerMode === 'video') document.body.classList.add('video-player');
const clientId = crypto.randomUUID();
const HEARTBEAT_INTERVAL_MS = 15000;
const IDLE_RELEASE_MS = 90000;
const HIDDEN_RELEASE_MS = 30000;
let currentIdx = 0;
let total = 0;
let currentLease = null;
let currentTask = null;
let busy = false;
let submitting = false;
let waitingForActivity = false;
let lastActivityAt = Date.now();
let hiddenReleaseTimer = null;
let resumeRequested = false;

function setUndoDepth(depth) {
  const value = Math.max(0, Math.min(5, Number(depth) || 0));
  undoButton.disabled = value === 0;
  undoButton.firstChild.textContent = 'Undo (' + value + '/5) ';
}

function annotatorValue() {
  const el = document.getElementById('annotator');
  return (el.value || 'default').trim() || 'default';
}

function initAnnotator() {
  const params = new URLSearchParams(window.location.search);
  const ann = params.get('annotator') || params.get('name') || localStorage.getItem('motion_labeler_annotator') || serverDefaultAnnotator || 'default';
  document.getElementById('annotator').value = ann;
  localStorage.setItem('motion_labeler_annotator', ann);
}

// ---- Video playback / sync -------------------------------------------------
// Linux browsers often decode two 50fps H.264 videos with slightly noisier
// clocks than macOS. Frequent hard seeks make that visible as jitter, so the
// left video is treated as the clock and the right video softly catches up.
const SOFT_SYNC_THRESHOLD = 0.08;
const HARD_SYNC_THRESHOLD = 0.75;
const LOOP_EDGE_SECONDS = 0.30;
const SYNC_INTERVAL_MS = 500;
const MAX_PLAYBACK_RATE_NUDGE = 0.04;
let syncing = false;
let restartPending = false;
let syncMode = pageParams.get('sync') || 'soft';

function hasUsableDurations() {
  return Number.isFinite(vl.duration) && Number.isFinite(vr.duration)
    && vl.duration > 0 && vr.duration > 0
    && Math.abs(vl.duration - vr.duration) <= 0.1;
}

function resetRates() {
  vl.playbackRate = 1.0;
  vr.playbackRate = 1.0;
}

function nearLoopEdge() {
  if (!hasUsableDurations()) return false;
  const nearStart = Math.min(vl.currentTime, vr.currentTime) < LOOP_EDGE_SECONDS;
  const nearEnd = Math.min(vl.duration - vl.currentTime, vr.duration - vr.currentTime) < LOOP_EDGE_SECONDS;
  return nearStart || nearEnd;
}

async function playBoth() {
  resetRates();
  await Promise.allSettled([vl.play(), vr.play()]);
}

function pauseBoth() {
  vl.pause();
  vr.pause();
  resetRates();
}

async function restartPair() {
  if (restartPending) return;
  restartPending = true;
  syncing = true;
  try {
    pauseBoth();
    vl.currentTime = 0;
    vr.currentTime = 0;
    await playBoth();
  } finally {
    syncing = false;
    restartPending = false;
  }
}

function syncFrom(source, target, hard = false) {
  if (syncing || !source.src || !target.src) return;
  syncing = true;
  try {
    if (hard || Math.abs(source.currentTime - target.currentTime) > HARD_SYNC_THRESHOLD) {
      target.currentTime = Math.min(source.currentTime, Math.max(0, target.duration || source.currentTime));
    }
    if (!source.paused && target.paused) {
      target.play().catch(() => {});
    } else if (source.paused && !target.paused) {
      target.pause();
    }
  } finally {
    syncing = false;
  }
}

vl.addEventListener('play', () => syncFrom(vl, vr, true));
vr.addEventListener('play', () => syncFrom(vr, vl, true));
vl.addEventListener('pause', () => { if (!syncing && !vr.paused) vr.pause(); });
vr.addEventListener('pause', () => { if (!syncing && !vl.paused) vl.pause(); });
vl.addEventListener('seeked', () => syncFrom(vl, vr, true));
vr.addEventListener('seeked', () => syncFrom(vr, vl, true));
vl.addEventListener('ended', restartPair);
vr.addEventListener('ended', restartPair);

setInterval(() => {
  if (syncMode === 'off') return;
  if (vl.paused || vr.paused || vl.seeking || vr.seeking || syncing) return;
  if (!hasUsableDurations()) { resetRates(); return; }
  const diff = vl.currentTime - vr.currentTime;
  const absDiff = Math.abs(diff);
  if (absDiff < SOFT_SYNC_THRESHOLD) { resetRates(); return; }
  if (nearLoopEdge()) return;
  if (absDiff > HARD_SYNC_THRESHOLD) {
    syncFrom(vl, vr, true);
    resetRates();
    return;
  }
  vr.playbackRate = diff > 0 ? 1.0 + MAX_PLAYBACK_RATE_NUDGE : 1.0 - MAX_PLAYBACK_RATE_NUDGE;
  vl.playbackRate = 1.0;
}, SYNC_INTERVAL_MS);

let loadToken = 0;

// ---- Resilient fetch -----------------------------------------------------
// Over a port-forwarded SSH tunnel, requests occasionally fail at the network
// layer (the browser reports "TypeError: Load failed") even though the server
// is healthy. Retry transient failures with backoff and bound each attempt
// with a timeout so a click never dies on a single dropped connection.
async function fetchRetry(url, opts = {}, retries = 4, timeoutMs = 20000) {
  let lastErr;
  for (let attempt = 0; attempt <= retries; attempt++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs);
    try {
      const r = await fetch(url, Object.assign({}, opts, {signal: ctrl.signal}));
      clearTimeout(timer);
      return r;
    } catch (e) {
      clearTimeout(timer);
      lastErr = e;
      if (attempt < retries) {
        await new Promise(res => setTimeout(res, 300 * (attempt + 1)));
      }
    }
  }
  throw lastErr;
}

// ---- Full-download blob cache -------------------------------------------
// Over a port-forwarded tunnel, streaming the MP4 directly stalls whenever
// playback catches up with the download. Instead we fetch each clip FULLY
// into a Blob and play from an in-memory object URL, so playback and looping
// are always perfectly smooth. Recently used clips stay cached, and upcoming
// pairs are pre-downloaded, so navigation is instant.
const MAX_CACHED_CLIPS = Math.max(18, Number(pageParams.get('cache') || 32));
const PREFETCH_WINDOW = Math.max(0, Math.min(24, Number(pageParams.get('prefetch') || 4)));
const PREFETCH_CONCURRENCY = Math.max(1, Math.min(4, Number(pageParams.get('prefetchConcurrency') || 2)));
const MEDIA_READY_TIMEOUT_MS = Math.max(60000, Number(pageParams.get('renderTimeout') || 600000));
const blobCache = new Map();   // url -> objectURL (insertion order = LRU)
const inflight = new Map();    // url -> Promise<objectURL> (dedupe concurrent fetches)
const prefetchQueued = new Set();
const prefetchQueue = [];
let prefetchActive = 0;

function evictCache() {
  for (const [url, obj] of blobCache) {
    if (blobCache.size <= MAX_CACHED_CLIPS) break;
    if (obj === vc.currentSrc || obj === vl.currentSrc || obj === vr.currentSrc) continue;  // keep in-use clips
    URL.revokeObjectURL(obj);
    blobCache.delete(url);
  }
}

function getClip(url) {
  url = resolveVideoUrl(url);
  const hit = blobCache.get(url);
  if (hit) { blobCache.delete(url); blobCache.set(url, hit); return Promise.resolve(hit); }
  if (inflight.has(url)) return inflight.get(url);
  const p = (async () => {
    const deadline = Date.now() + MEDIA_READY_TIMEOUT_MS;
    let resp;
    while (true) {
      resp = await fetchRetry(url, {}, 3, 60000);
      if (resp.status !== 202) break;
      if (Date.now() >= deadline) {
        throw new Error('video render timeout');
      }
      const retryAfter = Math.max(0.5, Number(resp.headers.get('Retry-After') || 1));
      await new Promise(resolve => setTimeout(resolve, retryAfter * 1000));
    }
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const blob = await resp.blob();
    if (!blob.size) throw new Error('empty video response');
    const obj = URL.createObjectURL(blob);
    blobCache.set(url, obj);
    evictCache();
    return obj;
  })().finally(() => inflight.delete(url));
  inflight.set(url, p);
  return p;
}

function resolveVideoUrl(url) {
  if (videoMode === 'source') return url.replace('/videos_compat/', '/videos/');
  return url;
}

function urlsForPrefetch(item) {
  if (playerMode === 'video') {
    return [item.left_url, item.right_url].map(resolveVideoUrl);
  }
  return [item.combined_url].map(resolveVideoUrl);
}

function mediaUrlsForTask(task) {
  return urlsForPrefetch(task).filter(Boolean);
}

function taskMediaCached(task) {
  return mediaUrlsForTask(task).every(url => blobCache.has(resolveVideoUrl(url)));
}

async function warmTaskMedia(task) {
  await Promise.all(mediaUrlsForTask(task).map(url => getClip(url)));
}

function schedulePrefetch(url) {
  url = resolveVideoUrl(url);
  if (!url || blobCache.has(url) || inflight.has(url) || prefetchQueued.has(url)) return;
  prefetchQueued.add(url);
  prefetchQueue.push(url);
  pumpPrefetchQueue();
}

function pumpPrefetchQueue() {
  while (prefetchActive < PREFETCH_CONCURRENCY && prefetchQueue.length) {
    const url = prefetchQueue.shift();
    prefetchActive += 1;
    getClip(url).catch(() => {}).finally(() => {
      prefetchActive -= 1;
      prefetchQueued.delete(url);
      pumpPrefetchQueue();
    });
  }
}

async function prefetchNext() {
  if (PREFETCH_WINDOW <= 0) return;
  try {
    const ann = encodeURIComponent(annotatorValue());
    const d = await (await fetchRetry('/api/prefetch?annotator=' + ann + '&limit=' + PREFETCH_WINDOW, {}, 2, 15000)).json();
    if (d.items) {
      for (const item of d.items) {
        if (item.ready && !item.error) {
          for (const url of urlsForPrefetch(item)) schedulePrefetch(url);
        }
      }
    }
  } catch (e) { /* best-effort prefetch */ }
}

async function mountAndPlay(task, myToken, statusEl) {
  if (playerMode === 'video') {
    return mountVideoPlayer(task.left_url, task.right_url, myToken, statusEl);
  }
  return mountCombinedPlayer(task.combined_url, myToken, statusEl);
}

function stopCombinedPlayer() {
  vc.pause();
  vc.removeAttribute('src');
  vc.load();
}

async function mountCombinedPlayer(combinedUrl, myToken, statusEl) {
  pauseBoth();
  vl.removeAttribute('src');
  vr.removeAttribute('src');
  vl.load();
  vr.load();
  if (!blobCache.has(resolveVideoUrl(combinedUrl))) {
    statusEl.textContent = 'Rendering and preparing video…';
  }
  const obj = await getClip(combinedUrl);
  if (myToken !== loadToken) return;
  vc.pause();
  vc.loop = true;
  vc.src = obj;
  vc.load();
  await waitForVideo(vc, 'combined');
  if (myToken !== loadToken) return;
  vc.currentTime = 0;
  await vc.play().catch(() => {});
}

async function mountVideoPlayer(leftUrl, rightUrl, myToken, statusEl) {
  stopCombinedPlayer();
  // Fully download both clips (from cache if already prefetched) before playing.
  if (!(blobCache.has(leftUrl) && blobCache.has(rightUrl))) {
    statusEl.textContent = 'Downloading videos...';
  }
  const [lo, ro] = await Promise.all([getClip(leftUrl), getClip(rightUrl)]);
  if (myToken !== loadToken) return;
  pauseBoth();
  vl.loop = false;
  vr.loop = false;
  vl.src = lo; vr.src = ro;
  vl.load(); vr.load();
  await Promise.all([waitForVideo(vl, 'left'), waitForVideo(vr, 'right')]);
  if (myToken !== loadToken) return;
  vl.currentTime = 0;
  vr.currentTime = 0;
  await playBoth();
}

function waitForVideo(video, name) {
  return new Promise((resolve, reject) => {
    const haveCurrentData = video.HAVE_CURRENT_DATA || 2;
    if (video.readyState >= haveCurrentData) { resolve(); return; }
    let done = false;
    const cleanup = () => {
      video.removeEventListener('loadeddata', onReady);
      video.removeEventListener('canplay', onReady);
      video.removeEventListener('error', onError);
      clearTimeout(timer);
    };
    const finish = (fn, value) => {
      if (done) return;
      done = true;
      cleanup();
      fn(value);
    };
    const onReady = () => finish(resolve);
    const onError = () => {
      const code = video.error ? video.error.code : 'unknown';
      finish(reject, new Error(name + ' video decode failed: ' + code));
    };
    const timer = setTimeout(() => finish(reject, new Error(name + ' video load timeout')), 15000);
    video.addEventListener('loadeddata', onReady);
    video.addEventListener('canplay', onReady);
    video.addEventListener('error', onError);
  });
}

async function checkedJson(response) {
  const data = await response.json();
  if (!response.ok) {
    throw new Error(data.detail || ('HTTP ' + response.status));
  }
  return data;
}

function showDone(statusEl, response) {
  currentLease = null;
  currentTask = null;
  stopCombinedPlayer();
  total = response.stats.annotations_total;
  document.getElementById('progress').textContent = 'Done';
  statusEl.textContent = 'No unannotated tasks for ' + annotatorValue();
  setUndoDepth(response.undo_depth);
  vl.removeAttribute('src'); vr.removeAttribute('src');
  vl.load(); vr.load();
}

async function acquireNextTask() {
  const annotator = encodeURIComponent(annotatorValue());
  const client = encodeURIComponent(clientId);
  const response = await fetchRetry(
    '/api/next?annotator=' + annotator + '&client_id=' + client,
    {}, 3, 20000
  );
  return checkedJson(response);
}

async function showNextTask(nextTask = null, saved = false) {
  const myToken = ++loadToken;
  const statusEl = document.getElementById('status');
  localStorage.setItem('motion_labeler_annotator', annotatorValue());
  try {
    const d = nextTask || await acquireNextTask();
    if (myToken !== loadToken) return;
    if (d.done) {
      showDone(statusEl, d);
      return;
    }
    if (d.client_id !== clientId) throw new Error('server returned a lease for another client');
    currentTask = d;
    currentLease = d.lease_id;
    currentIdx = d.idx;
    setUndoDepth(d.undo_depth);
    total = d.stats.annotations_total;
    document.getElementById('progress').textContent =
      d.stats.annotations_done + ' / ' + total;
    if (!taskMediaCached(d)) {
      statusEl.textContent = 'Preparing video… The first render may take a few minutes.';
    }
    await mountAndPlay(d, myToken, statusEl);
    if (myToken !== loadToken) return;
    lastActivityAt = Date.now();
    statusEl.textContent = 'Loaded pair ' + d.pair_id;
    prefetchNext();
  } catch(e) {
    const detail = e && e.message ? e.message : e;
    statusEl.textContent = saved
      ? '保存成功，但下一视频加载失败，请点击 Reload Task：' + detail
      : '视频加载失败，请重新加载 (video error: ' + detail + ')';
  }
}

async function loadNext() {
  if (busy) {
    resumeRequested = true;
    return;
  }
  busy = true;
  try {
    await showNextTask();
  } finally {
    busy = false;
    if (resumeRequested) {
      resumeRequested = false;
      loadNext();
    }
  }
}

async function saveLabelForTask(task, choice) {
  const response = await fetchRetry('/api/label', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      idx: task.idx,
      lease_id: task.lease_id,
      label: choice,
      annotator: task.annotator_id,
      client_id: clientId
    })
  }, 4, 20000);
  return checkedJson(response);
}

async function label(choice) {
  if (busy || !currentTask || !currentLease) return;
  busy = true;
  submitting = true;
  const task = currentTask;
  const leaseId = currentLease;
  const statusEl = document.getElementById('status');
  statusEl.textContent = 'Saving...';
  try {
    const response = await saveLabelForTask(task, choice);
    if (currentLease === leaseId) {
      currentTask = null;
      currentLease = null;
    }
    total = response.stats.annotations_total;
    document.getElementById('progress').textContent =
      response.stats.annotations_done + ' / ' + total;
    statusEl.textContent = response.status;
    setUndoDepth(response.undo_depth);
    submitting = false;
    if (response.done) {
      showDone(statusEl, response);
      return;
    }
    await showNextTask(response.next_task, true);
  } catch (error) {
    statusEl.textContent = '保存失败 (save error: ' + error.message + ')';
  } finally {
    submitting = false;
    busy = false;
  }
}

async function reloadCurrentTask() {
  if (busy || !currentTask) return;
  busy = true;
  const myToken = ++loadToken;
  const statusEl = document.getElementById('status');
  try {
    statusEl.textContent = 'Reloading...';
    await warmTaskMedia(currentTask);
    await mountAndPlay(currentTask, myToken, statusEl);
    if (myToken === loadToken) {
      lastActivityAt = Date.now();
      statusEl.textContent = 'Loaded pair ' + currentTask.pair_id;
    }
  } catch(e) {
    statusEl.textContent =
      '视频加载失败，请重新加载 (video error: ' + (e && e.message ? e.message : e) + ')';
  } finally {
    busy = false;
  }
}

async function undoLast() {
  if (busy || submitting || undoButton.disabled) return;
  busy = true;
  const previousTask = currentTask;
  const previousLease = currentLease;
  const myToken = ++loadToken;
  const statusEl = document.getElementById('status');
  let undoCommitted = false;
  statusEl.textContent = 'Undoing last annotation...';
  try {
    const response = await fetchRetry('/api/undo', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        annotator: annotatorValue(),
        client_id: clientId
      })
    }, 2, 20000);
    const data = await checkedJson(response);
    undoCommitted = true;
    if (myToken !== loadToken) return;
    const task = data.task;
    if (task.client_id !== clientId) throw new Error('server returned a lease for another client');
    currentTask = task;
    currentLease = task.lease_id;
    currentIdx = task.idx;
    total = data.stats.annotations_total;
    document.getElementById('progress').textContent =
      data.stats.annotations_done + ' / ' + total;
    setUndoDepth(data.undo_depth);
    await mountAndPlay(task, myToken, statusEl);
    if (myToken !== loadToken) return;
    lastActivityAt = Date.now();
    statusEl.textContent = data.status;
  } catch (error) {
    if (!undoCommitted) {
      currentTask = previousTask;
      currentLease = previousLease;
      statusEl.textContent = '回退失败 (undo error: ' + error.message + ')';
    } else {
      statusEl.textContent = '回退成功，但视频加载失败，请点击 Reload Task：' + error.message;
    }
  } finally {
    busy = false;
  }
}

function nav(delta) { if(delta > 0) reloadCurrentTask(); }

function leaseBody(task) {
  return JSON.stringify({
    lease_id: task.lease_id,
    annotator: task.annotator_id,
    client_id: clientId
  });
}

async function releaseCurrentLease(message) {
  const task = currentTask;
  if (!task || submitting) return;
  ++loadToken;
  currentLease = null;
  currentTask = null;
  waitingForActivity = true;
  stopCombinedPlayer();
  const response = await fetch('/api/lease/release', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: leaseBody(task)
  });
  await checkedJson(response);
  document.getElementById('status').textContent = message;
}

async function heartbeat() {
  const task = currentTask;
  if (!task || submitting || document.hidden) return;
  if (!busy && Date.now() - lastActivityAt >= IDLE_RELEASE_MS) {
    await releaseCurrentLease('Lease released after inactivity. Interact to continue.');
    return;
  }
  const response = await fetch('/api/lease/heartbeat', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: leaseBody(task)
  });
  if (response.status === 409) {
    if (currentLease === task.lease_id) {
      ++loadToken;
      currentLease = null;
      currentTask = null;
    }
    document.getElementById('status').textContent = 'Lease expired; acquiring another pair...';
    await loadNext();
    return;
  }
  const data = await checkedJson(response);
  if (currentLease === task.lease_id) {
    currentTask.lease_expires_at = data.lease_expires_at;
  }
}

async function switchAnnotator() {
  if (submitting) {
    document.getElementById('annotator').value = currentTask.annotator_id;
    document.getElementById('status').textContent = 'Wait for the current label to save.';
    return;
  }
  const task = currentTask;
  if (task) {
    ++loadToken;
    currentLease = null;
    currentTask = null;
    const response = await fetch('/api/lease/release', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: leaseBody(task)
    });
    await checkedJson(response);
  }
  localStorage.setItem('motion_labeler_annotator', annotatorValue());
  lastActivityAt = Date.now();
  waitingForActivity = false;
  loadNext();
}

function markActivity() {
  lastActivityAt = Date.now();
  if (!waitingForActivity || document.hidden) return;
  waitingForActivity = false;
  setTimeout(loadNext, 0);
}

for (const eventName of ['pointerdown', 'keydown', 'touchstart']) {
  document.addEventListener(eventName, markActivity, {passive: true});
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    clearTimeout(hiddenReleaseTimer);
    hiddenReleaseTimer = setTimeout(() => {
      releaseCurrentLease('Lease released while this window was inactive.').catch(error => {
        document.getElementById('status').textContent = 'Lease release failed: ' + error.message;
      });
    }, HIDDEN_RELEASE_MS);
    return;
  }
  clearTimeout(hiddenReleaseTimer);
  hiddenReleaseTimer = null;
  markActivity();
});

window.addEventListener('pagehide', () => {
  if (!currentTask || submitting) return;
  const payload = new Blob([leaseBody(currentTask)], {type: 'application/json'});
  navigator.sendBeacon('/api/lease/release', payload);
});

setInterval(() => {
  heartbeat().catch(error => {
    document.getElementById('status').textContent = 'Lease heartbeat failed: ' + error.message;
  });
}, HEARTBEAT_INTERVAL_MS);

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (e.key === '1') label('left');
  else if (e.key === '2') label('right');
  else if (e.key === '3') label('similar');
  else if (e.key === '4') label('bad_traj');
  else if (e.key === 'd' || e.key === 'D') nav(1);
  else if (e.key === 'u' || e.key === 'U') undoLast();
});

initAnnotator();
loadNext();
</script></body></html>
