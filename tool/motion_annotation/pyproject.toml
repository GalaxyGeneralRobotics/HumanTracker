[project]
name = "motion_annotation"
version = "0.1.0"
description = "Web-based pairwise robot motion labeling tool (FastAPI + MuJoCo offscreen rendering)"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "mujoco>=3.4.0",
    "numpy>=2.4.1",
    "scipy>=1.17.0",
    "pandas>=2.3.3",
    "pyarrow>=22.0.0",
    "imageio>=2.37.2",
    "imageio-ffmpeg>=0.6.0",
    "opencv-python>=4.11.0.86",
    "matplotlib>=3.10.8",
    "h5py>=3.15.1",
]
